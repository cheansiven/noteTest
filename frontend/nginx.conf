server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vue Router uses history mode: unknown paths are client-side routes,
    # so fall back to index.html instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached indefinitely. Set Cache-Control once -
    # "expires" would emit a second, competing Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or clients keep loading stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Serve the API from the same origin as the app.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
